<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Filter for High Contrast Foreground Text -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.05); }
    }
    @keyframes floatParticleA {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes floatParticleB {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(16px) translateX(-14px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes pulseRing {
      0% { r: 6px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }
    .bg-pulse {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 8, 6;
      animation: dashCycle 6s linear infinite;
    }
    .particle-1 { animation: floatParticleA 7s ease-in-out infinite; }
    .particle-2 { animation: floatParticleB 9s ease-in-out infinite; }
    .ring-pulse { animation: pulseRing 3s ease-out infinite; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Deep Slate Outer Canvas -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />
  <rect width="1196" height="336" x="2" y="2" fill="none" stroke="#334155" stroke-width="1.5" rx="15" opacity="0.6" />

  <!-- Dynamic Ambient Glow Blobs in Background -->
  <circle cx="200" cy="170" r="140" fill="url(#glowGrad)" class="bg-pulse" />
  <circle cx="1000" cy="170" r="160" fill="url(#glowGrad)" class="bg-pulse" style="animation-delay: -4s;" />

  <!-- Animated Pipeline Flow Connectors (Background Layer) -->
  <g opacity="0.45">
    <!-- Stream Line Across Canvas -->
    <path d="M 60 270 C 300 240, 450 310, 600 270 C 750 230, 950 300, 1140 260" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
    <path d="M 60 70 C 250 110, 480 30, 680 75 C 880 120, 1020 40, 1140 80" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line" style="animation-duration: 9s;" />
  </g>

  <!-- Subtle Floating Node Particles -->
  <g class="particle-1">
    <circle cx="120" cy="110" r="4" fill="#38bdf8" />
    <circle cx="1080" cy="120" r="5" fill="#818cf8" />
    <circle cx="940" cy="270" r="4" fill="#c084fc" />
  </g>
  <g class="particle-2">
    <circle cx="160" cy="250" r="5" fill="#c084fc" />
    <circle cx="1040" cy="220" r="3" fill="#38bdf8" />
    <circle cx="260" cy="80" r="4" fill="#818cf8" />
  </g>

  <!-- Animated Reconcile Sync Beacon (GitOps indicator) -->
  <g transform="translate(1100, 50)">
    <circle cx="0" cy="0" r="6" fill="#10b981" />
    <circle cx="0" cy="0" r="6" fill="none" stroke="#10b981" stroke-width="2" class="ring-pulse" />
    <text x="-40" y="4" font-family="-apple-system, sans-serif" font-size="11" fill="#6ee7b7" font-weight="600" text-anchor="end">SYNCED</text>
  </g>

  <!-- Foreground Title and Branding Content -->
  <g filter="url(#shadow)">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 65)">
      <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
      <text x="0" y="5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" letter-spacing="1.5" text-anchor="middle">⚡ CONTINUOUS DELIVERY &amp; GITOPS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" class="title-text" font-size="44" fill="#ffffff" text-anchor="middle">
      Awesome GitOps &amp; Continuous Delivery
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="190" class="sub-text" font-size="18" fill="#94a3b8" text-anchor="middle">
      The Curated Ecosystem for Declarative Kubernetes Deployments &amp; Automated Delivery Pipelines
    </text>

    <!-- Dynamic Pillar Badges (Foreground) -->
    <g transform="translate(600, 245)" filter="url(#pillShadow)">
      <!-- Pill 1: GitOps Reconcile -->
      <g transform="translate(-320, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="-62" cy="0" r="5" fill="#38bdf8" />
        <text x="-48" y="5" class="badge-label">GitOps Engines</text>
      </g>

      <!-- Pill 2: Kubernetes Native -->
      <g transform="translate(-105, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="-72" cy="0" r="5" fill="#818cf8" />
        <text x="-58" y="5" class="badge-label">Kubernetes Native</text>
      </g>

      <!-- Pill 3: Progressive Delivery -->
      <g transform="translate(115, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="-72" cy="0" r="5" fill="#a855f7" />
        <text x="-58" y="5" class="badge-label">Progressive Delivery</text>
      </g>

      <!-- Pill 4: Supply Chain Trust -->
      <g transform="translate(325, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="-62" cy="0" r="5" fill="#10b981" />
        <text x="-48" y="5" class="badge-label">Supply Chain Trust</text>
      </g>
    </g>

    <!-- Bottom Metadata Legend -->
    <text x="600" y="305" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      Open-Source GitHub Standards • Enterprise SaaS Platforms • Production Verification &amp; Rollback
    </text>
  </g>
</svg>
